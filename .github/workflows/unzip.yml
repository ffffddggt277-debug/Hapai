name: Распаковать ZIP
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковка
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -q -o "$ZIP" -d _tmp
          if [ -d _tmp/hapai2 ]; then cp -a _tmp/hapai2/. .; else cp -a _tmp/. .; fi
          rm -rf _tmp "$ZIP"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Распакован проект ХАПАЙ! 2.0" || echo "Нечего коммитить"
          git push
